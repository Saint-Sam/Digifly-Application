name: Private alpha checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tester-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install private alpha
        run: python -m pip install -e ".[test]"
      - name: Run package and interface smoke tests
        run: >-
          python -m pytest
          tests/test_package_foundation.py
          tests/test_resource_profile.py
          tests/test_resource_management_ui.py
          tests/test_ui_smoke.py

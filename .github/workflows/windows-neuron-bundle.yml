name: Windows with included NEURON and shared SWC libraries
on:
  push:
    branches: [windows-neuron-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare exact offline official Windows runtime
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          python scripts/build_windows_neuron_payload.py --destination "$env:GITHUB_WORKSPACE/neuron-offline" --work "$env:RUNNER_TEMP/neuron-build"
          if ($LASTEXITCODE -ne 0) { throw 'Official runtime payload build failed' }
          python -c "from pathlib import Path; from digifly_app.core.windows_neuron_bundle import install_included_neuron; install_included_neuron(directory=Path('neuron-offline'), destination=Path(r'$env:RUNNER_TEMP/private-neuron-test'))"
          if ($LASTEXITCODE -ne 0) { throw 'Private installed runtime/HH check failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: included-neuron-runtime-20261015
          if-no-files-found: warn
          path: |
            neuron-offline/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: included-neuron-runtime-health-20261015
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/private-neuron-test/digifly-install-receipt.json
  app:
    needs: runtime
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DIGIFLY_RELEASE_VERSION: 0.1.0-alpha.20261025.6
      DIGIFLY_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/download-artifact@v4
        with:
          name: included-neuron-runtime-20261015
          path: downloaded-runtime
      - name: Source tests and native Windows UI build
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/setup_dev.ps1
          if ($LASTEXITCODE -ne 0) { throw 'App setup failed' }
          if (Test-Path bundled_data/manc/unique_pairs_by_id.parquet) { $env:DIGIFLY_TEST_MANC_PARQUET = (Resolve-Path bundled_data/manc/unique_pairs_by_id.parquet).Path }
          ./.venv/Scripts/python.exe -m pytest tests/test_library_review_launch.py tests/test_neuprint_contacts.py tests/test_located_contact_execution.py tests/test_aggregate_chemical_execution.py tests/test_swc_fragments.py tests/test_swc_quality.py tests/test_swc_units.py tests/test_mechanisms.py tests/test_bmtk_bionet_worker.py tests/test_channel_execution.py tests/test_regional_execution.py tests/test_generic_experiment.py::test_classic_arbor_request_pins_hh_table_translator_without_native_channels --junitxml=connected-model-source-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Connected-model/fragment source regressions failed' }
          ./.venv/Scripts/python.exe -m pytest tests/test_connectivity_download.py tests/test_circuit_library.py tests/test_circuit_builder_ui.py tests/test_saved_neurons.py tests/test_linked_libraries.py tests/test_linked_libraries_ui.py tests/test_windows_neuron_bundle.py tests/test_windows_package.py tests/test_windows_release.py tests/test_stage_pdcm_bionet_assets.py tests/test_app_settings.py tests/test_ui_wording.py tests/test_swc_library.py tests/test_bundled_pair_graph.py tests/test_neuprint_ui.py tests/test_neuprint_acquisition.py tests/test_data_library.py tests/test_connectomes.py tests/test_connectome_picker.py tests/test_updates.py tests/test_update_installer.py tests/test_update_cleanup.py tests/test_updater_gate.py tests/test_updater_ui.py tests/test_project.py tests/test_morphology.py tests/test_experiment_builder_readiness.py tests/test_generic_experiment.py::test_downloaded_male_pair_graph_cannot_silently_use_native_contacts --junitxml=neuron-source-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Source regressions failed' }
          # Offscreen is only for inert unit tests. The real MainWindow has
          # QOpenGLWidgets and must use the native Windows platform plugin,
          # exactly as the already-qualified interface-only package check did.
          $env:QT_QPA_PLATFORM = 'windows'
          $env:DIGIFLY_NEURON_PAYLOAD = (Resolve-Path downloaded-runtime).Path
          New-Item -ItemType Directory installers/neuron -Force | Out-Null
          Copy-Item downloaded-runtime/* installers/neuron
          $sourcePython = (Resolve-Path .venv/Scripts/python.exe).Path
          $sourceReport = "$env:GITHUB_WORKSPACE/source-neuron-ui-evidence"
          $sourceCheck = Start-Process -FilePath $sourcePython -ArgumentList @('-m', 'digifly_app.app', '--package-neuron-test', $sourceReport) -RedirectStandardOutput source-ui-stdout.txt -RedirectStandardError source-ui-stderr.txt -PassThru
          if (-not $sourceCheck.WaitForExit(240000)) { taskkill /PID $sourceCheck.Id /T /F; Get-Content source-neuron-ui-evidence/receipt.json,source-neuron-ui-evidence/thread-stacks.txt,source-ui-stderr.txt -ErrorAction Continue; throw 'Source app setup/Run gate timed out before compiler' }
          $sourceCheck.Refresh()
          Write-Host "Source UI exit code: $($sourceCheck.ExitCode)"
          if ($sourceCheck.ExitCode -ne 0) { Get-Content source-neuron-ui-evidence/receipt.json,source-neuron-ui-evidence/thread-stacks.txt,source-ui-stderr.txt -ErrorAction Continue; throw 'Source app setup/Run gate failed before compiler' }
          $sourceReceipt = Get-Content source-neuron-ui-evidence/receipt.json | ConvertFrom-Json
          if (-not $sourceReceipt.ok) { throw 'Source UI receipt did not pass' }
          ./scripts/build_windows.ps1
      - name: Extract real app and install/use included NEURON through UI
        shell: pwsh
        run: |
          Expand-Archive "dist/Digifly-Workstation-$env:DIGIFLY_RELEASE_VERSION-Windows-x86_64.zip" -DestinationPath "$env:RUNNER_TEMP/extracted-app"
          $exe = "$env:RUNNER_TEMP/extracted-app/Digifly Workstation.exe"
          $report = "$env:GITHUB_WORKSPACE/neuron-ui-evidence"
          $p = Start-Process -FilePath $exe -ArgumentList @('--package-neuron-test', $report) -RedirectStandardOutput packaged-ui-stdout.txt -RedirectStandardError packaged-ui-stderr.txt -PassThru
          if (-not $p.WaitForExit(300000)) { taskkill /PID $p.Id /T /F; Get-Content "$report/receipt.json","$report/thread-stacks.txt",packaged-ui-stderr.txt -ErrorAction Continue; throw 'Native packaged setup check timed out' }
          $p.Refresh()
          Write-Host "Packaged UI exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$report/receipt.json","$report/thread-stacks.txt",packaged-ui-stderr.txt -ErrorAction Continue; throw 'Native packaged setup/Run check failed' }
          $receipt = Get-Content "$report/receipt.json" | ConvertFrom-Json
          if (-not $receipt.ok) { throw 'Packaged UI receipt did not pass' }
          $libraryReport = "$env:GITHUB_WORKSPACE/swc-library-ui-evidence"
          $libraryCheck = Start-Process -FilePath $exe -ArgumentList @('--package-library-test', $libraryReport) -RedirectStandardOutput packaged-library-ui-stdout.txt -RedirectStandardError packaged-library-ui-stderr.txt -PassThru
          if (-not $libraryCheck.WaitForExit(180000)) { taskkill /PID $libraryCheck.Id /T /F; throw 'Packaged SWC library check timed out' }
          $libraryCheck.Refresh()
          if ($libraryCheck.ExitCode -ne 0) { Get-Content "$libraryReport/receipt.json",packaged-library-ui-stderr.txt -ErrorAction Continue; throw 'Packaged SWC library check failed' }
          $libraryReceipt = Get-Content "$libraryReport/receipt.json" | ConvertFrom-Json
          if (-not $libraryReceipt.ok) { throw 'Packaged SWC library receipt did not pass' }
          $pairReport = "$env:GITHUB_WORKSPACE/included-pair-ui-evidence"
          $pairCheck = Start-Process -FilePath $exe -ArgumentList @('--package-smoke-test', $pairReport, '--data-reader', ('"' + $receipt.installed_python + '"'), '--included-parquet') -RedirectStandardOutput packaged-pair-ui-stdout.txt -RedirectStandardError packaged-pair-ui-stderr.txt -PassThru
          if (-not $pairCheck.WaitForExit(180000)) { taskkill /PID $pairCheck.Id /T /F; throw 'Included all-row Parquet app check timed out' }
          $pairCheck.Refresh()
          if ($pairCheck.ExitCode -ne 0) { Get-Content "$pairReport/receipt.json",packaged-pair-ui-stderr.txt -ErrorAction Continue; throw 'Included all-row Parquet app check failed' }
          $pairReceipt = Get-Content "$pairReport/receipt.json" | ConvertFrom-Json
          if (-not $pairReceipt.ok) { throw 'Included Parquet receipt did not pass' }
          # Blocking native helper gate: actual disposable EXE install/restart,
          # then injected startup failure -> exact old-tree restore/reopen.
          ./.venv/Scripts/python.exe scripts/check_packaged_updater.py --application "$env:RUNNER_TEMP/extracted-app" --archive "dist/Digifly-Workstation-$env:DIGIFLY_RELEASE_VERSION-Windows-x86_64.zip" --output "$env:GITHUB_WORKSPACE/updater-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Native updater install/relaunch/rollback gate failed' }
          ./.venv/Scripts/python.exe scripts/windows_package.py check --bundle "$env:RUNNER_TEMP/extracted-app"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted final artifact changed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-with-NEURON-20261015
          if-no-files-found: warn
          path: |
            dist/*.zip
            dist/*.sha256
            neuron-source-tests.xml
            connected-model-source-tests.xml
            source-neuron-ui-evidence/*.json
            source-neuron-ui-evidence/*.txt
            source-neuron-ui-evidence/*.png
            neuron-ui-evidence/*.json
            neuron-ui-evidence/*.txt
            neuron-ui-evidence/*.png
            swc-library-ui-evidence/*.json
            swc-library-ui-evidence/*.png
            included-pair-ui-evidence/*.json
            included-pair-ui-evidence/*.png
            updater-evidence/receipt.json
            updater-evidence/*.log
            updater-evidence/*-window.png
            updater-evidence/*/parent.log
            updater-evidence/*/gui/ui-failure.json
            updater-evidence/*/gui/runtime-context.json
            updater-evidence/*/gui/metadata-safety.json
            updater-evidence/*/gui/digest-download.json
            updater-evidence/*/gui/cache/install-*/installer.log
            updater-evidence/*/gui/cache/install-*/relaunch.log
            updater-evidence/*/gui/cache/install-*/rollback-relaunch.log
            updater-evidence/*/gui/cache/install-*/result.json
            updater-evidence/*/gui/cache/install-*/cleanup.json
            *-ui-stdout.txt
            *-ui-stderr.txt

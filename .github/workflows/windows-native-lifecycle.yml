name: Windows native window lifecycle diagnosis
on:
  push:
    branches: [windows-neuron-20261015]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  graphics:
    if: contains(github.event.head_commit.message, '[graphics-only]')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact compiler and Qt versions
        run: python -m pip install PySide6==6.10.3
      - uses: actions/download-artifact@v4
        with:
          name: Windows-with-NEURON-20261015
          run-id: 41529119279
          github-token: ${{ github.token }}
          path: failed-app
      - name: Preserve and inspect the compiled app with its missing Qt dependency
        run: |
          python scripts/prepare_windows_test_display.py --output windows-graphics-display.json
          python -c "from pathlib import Path;from zipfile import ZipFile;import json; p=next(Path('failed-app/dist').glob('*.zip')); print(p); print('Qt wheel graphics dependency inspection follows')"
          python scripts/windows_graphics_payload_diagnostic.py --artifact-directory failed-app --output windows-graphics
      - name: Exercise the unchanged compiled Results and safety check
        shell: pwsh
        run: |
          $env:QT_LOGGING_RULES = 'qt.qpa.gl=true'
          $exe = (Resolve-Path 'windows-graphics/app/Digifly Workstation.exe').Path
          $report = "$env:GITHUB_WORKSPACE/windows-graphics/results"
          $p = Start-Process -FilePath $exe -ArgumentList @('--package-results-test', $report) -RedirectStandardOutput windows-graphics/stdout.txt -RedirectStandardError windows-graphics/stderr.txt -PassThru
          if (-not $p.WaitForExit(120000)) { taskkill /PID $p.Id /T /F; throw 'Compiled Results dependency diagnosis timed out' }
          $p.Refresh()
          Get-Content "$report/receipt.json",windows-graphics/stderr.txt -ErrorAction Continue
          if ($p.ExitCode -ne 0) { throw 'Compiled Results dependency diagnosis failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-compiled-graphics-diagnosis
          path: |
            windows-graphics/*.json
            windows-graphics/*.txt
            windows-graphics/results/*.json
            windows-graphics/results/*.png
            windows-graphics-display.json
  results:
    if: contains(github.event.head_commit.message, '[results-only]')
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: python -m pip install -e .
      - name: Prepare native test desktop
        run: python scripts/prepare_windows_test_display.py --output windows-results-display.json
      - name: Exercise actual native Results and safety checks
        run: python scripts/check_swc_library_gui.py --source --results-only --output windows-results-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-results-diagnosis
          path: |
            windows-results-evidence/**
            windows-results-display.json
  guide:
    if: contains(github.event.head_commit.message, '[guide-only]')
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: python -m pip install -e .
      - name: Prepare sufficient disposable desktop space
        run: python scripts/prepare_windows_test_display.py --output windows-guide-display.json
      - name: Observe actual wizard pointer targets
        run: python scripts/windows_guide_diagnostic.py --output windows-guide-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-guide-diagnosis
          path: |
            windows-guide-evidence/**
            windows-guide-display.json
  diagnose:
    if: contains(github.event.head_commit.message, '[lifecycle-only]') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: included-neuron-runtime-20261015
          run-id: 41512336463
          github-token: ${{ github.token }}
          path: installers/neuron
      - name: Compare native window deletion cases
        shell: pwsh
        run: |
          $env:DIGIFLY_NEURON_PAYLOAD = (Resolve-Path installers/neuron).Path
          python scripts/windows_native_lifecycle_diagnostic.py --output windows-native-lifecycle-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-native-lifecycle-diagnosis
          path: windows-native-lifecycle-evidence/**

name: Windows private release build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag to receive the Windows download
        required: true
        default: v0.1.0-alpha.1
      app_version:
        description: Numeric application version
        required: true
        default: 0.1.0

permissions:
  contents: write
  packages: write

jobs:
  simulator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.simulators
          push: true
          tags: ghcr.io/saint-sam/digifly-simulators:0.1.0-alpha.1
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-publish:
    needs: simulator-image
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install native build tools
        run: python -m pip install cmake ninja
      - name: Build native Windows app with Arbor
        shell: pwsh
        env:
          DIGIFLY_RELEASE_VERSION: ${{ inputs.app_version }}
          DIGIFLY_BUILD_NUMBER: ${{ github.run_number }}
          DIGIFLY_ARBOR_VERSION: "0.12.2"
        run: |
          ./scripts/setup_dev.ps1
          ./scripts/build_windows.ps1
      - name: Preserve tester artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digifly-Workstation-Windows-x86_64
          path: |
            dist/Digifly-Workstation-${{ inputs.app_version }}-Windows-x86_64.zip
            dist/Digifly-Workstation-${{ inputs.app_version }}-Windows-x86_64.zip.sha256
          if-no-files-found: error
      - name: Attach Windows build to permanent prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseVersion = "${{ inputs.release_tag }}" -replace '^v', ''
          $source = "dist/Digifly-Workstation-${{ inputs.app_version }}-Windows-x86_64.zip"
          $target = "dist/Digifly-Workstation-$releaseVersion-Windows-x86_64.zip"
          Move-Item $source $target
          (Get-FileHash $target -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $target -Leaf) | Set-Content "$target.sha256" -Encoding ascii
          gh release upload "${{ inputs.release_tag }}" $target "$target.sha256" --clobber

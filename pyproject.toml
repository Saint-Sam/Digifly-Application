[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digifly-app"
version = "0.1.0"
description = "A guided desktop workbench for Digifly experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10.3,<6.11",
  "psutil>=6,<8",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
digifly-app = "digifly_app.app:main"
digifly-doctor = "digifly_app.cli:doctor_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
